    --cream-100: #F8EEE5;

    --ink-900: #362818;
    --ink-700: #4A3728;

    --font-serif: 'Playfair Display', Georgia, serif;
    --font-script: 'Great Vibes', cursive;

    --ease-out-back: cubic-bezier(.2,.8,.2,1);

  /* ============================================================
     RESET
     ============================================================ */
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    width:100%;
    overflow-x:hidden;
    background:var(--cream-100);
  }
  body{
    min-height:100vh;
    min-height:100dvh;
    font-family:var(--font-sans);
    color:var(--ink-700);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
  }
  h1,p{ margin:0; }
  button{ font:inherit; color:inherit; background:none; border:0; }
  .visually-hidden{
    position:absolute; width:1px; height:1px;
    padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  /* ============================================================
     STAGE — full-viewport composition
     ============================================================ */
  .stage{
    position:relative;
    width:100%;
    min-height:100vh;
    min-height:100dvh;
    overflow:hidden;
    display:grid;
    place-items:center;
    padding:5vh 24px;
  }

  /* ---------- background: cover mode (landscape / desktop / tablet) ---------- */
  .bg-parallax{
    position:absolute;
    inset:0;
    z-index:1;
  }
  .bg-layer--cover{
    position:absolute;
    inset:0;
    background-image:var(--bg-image);
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    transform:scale(1.06);
  }

  /* ---------- background: framed mode (portrait phones/tablets) ---------- */
  .bg-layer--frame{
    display:none;
  }

  .glow{ position:absolute; pointer-events:none; }
  .glow-ambient{
    top:-15%; right:-12%;
    width:65%; height:65%;
    background:radial-gradient(circle, rgba(255,221,171,0.4), rgba(255,221,171,0) 70%);
    filter:blur(50px);
    mix-blend-mode:soft-light;
    z-index:2;
    animation:ambientPulse 11s ease-in-out infinite alternate;
  }
  .glow-diya{
    left:76.6%; top:33.7%;
    width:100px; height:100px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,197,122,0.6), rgba(255,197,122,0) 72%);
    filter:blur(8px);
    mix-blend-mode:screen;
    z-index:2;
    animation:diyaFlicker 3.4s ease-in-out infinite;
  }
  @keyframes ambientPulse{ 0%{opacity:.45;} 100%{opacity:.9;} }
  @keyframes diyaFlicker{
    0%,100%{ opacity:.5; transform:translate(-50%,-50%) scale(1); }
    22%{ opacity:.76; transform:translate(-50%,-50%) scale(1.08); }
    48%{ opacity:.4; transform:translate(-50%,-50%) scale(0.94); }
    70%{ opacity:.68; transform:translate(-50%,-50%) scale(1.04); }
    85%{ opacity:.52; transform:translate(-50%,-50%) scale(0.98); }
  }

  .rakhi-hotspot{
    position:absolute;
    left:66%; top:62%;
    width:130px; height:130px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    cursor:pointer;
    z-index:3;
  }
  .rakhi-hotspot::before{
    content:"";
    position:absolute; inset:0;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,214,150,0.5), rgba(255,214,150,0) 70%);
    opacity:0;
    transform:scale(.6);
    transition:opacity .5s ease, transform .5s ease;
  }
  .rakhi-hotspot:hover::before,
  .rakhi-hotspot.is-active::before{ opacity:1; transform:scale(1.15); }
  .rakhi-spark{
    position:absolute; top:50%; left:50%;
    width:5px; height:5px; border-radius:50%;
    background:var(--white-glow);
    opacity:0;
    --ex:0px; --ey:0px;
  }
  .rakhi-spark.s1{ --ex:32px; --ey:-30px; }
  .rakhi-spark.s2{ --ex:-28px; --ey:-34px; }
  .rakhi-spark.s3{ --ex:6px; --ey:-42px; }
  .rakhi-hotspot:hover .rakhi-spark.s1,  .rakhi-hotspot.is-active .rakhi-spark.s1{ animation:sparkOut 1.1s ease-out; }
  .rakhi-hotspot:hover .rakhi-spark.s2,  .rakhi-hotspot.is-active .rakhi-spark.s2{ animation:sparkOut 1.1s ease-out .12s; }
  .rakhi-hotspot:hover .rakhi-spark.s3,  .rakhi-hotspot.is-active .rakhi-spark.s3{ animation:sparkOut 1.1s ease-out .24s; }
  @keyframes sparkOut{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(.4); }
    30%{ opacity:1; }
    100%{ opacity:0; transform:translate(calc(-50% + var(--ex)), calc(-50% + var(--ey))) scale(1); }
  }

  .bg-tint{
    position:absolute; inset:0; z-index:2; pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 45%, rgba(255,250,242,0.14), rgba(255,250,242,0) 60%),
      linear-gradient(180deg, rgba(40,28,18,0.05) 0%, rgba(40,28,18,0) 16%, rgba(40,28,18,0) 80%, rgba(40,28,18,0.09) 100%);
  }
  .grain{
    position:absolute; inset:0; z-index:4; pointer-events:none;
    opacity:.05;
    mix-blend-mode:overlay;
    background-image:var(--grain-image);
    background-size:180px 180px;
  }

  .particles{ position:absolute; inset:0; z-index:5; overflow:hidden; pointer-events:none; opacity:.55; transition:opacity 1.2s ease; }
  .stage.is-open .particles{ opacity:1; }
  .particle{
    position:absolute;
    bottom:-6%;
    left:var(--left);
    width:var(--size); height:var(--size);
    border-radius:50%;
    background:radial-gradient(circle, var(--white-glow), rgba(255,248,236,0));
    opacity:0;
    filter:blur(.4px);
    animation:particleFloat var(--duration) linear var(--delay) infinite;
  }
  @keyframes particleFloat{
    0%{ transform:translate(0,0); opacity:0; }
    8%{ opacity:var(--peak); }
    85%{ opacity:var(--peak); }
    100%{ transform:translate(var(--drift), -112vh); opacity:0; }
  }

  .deco-hearts{ position:absolute; inset:0; z-index:5; pointer-events:none; }
  .deco-heart{
    position:absolute;
    color:var(--white-glow);
    opacity:.4;
    font-size:1.1rem;
    animation:heartFloat 6s ease-in-out infinite;
    text-shadow:0 2px 10px rgba(156,87,56,.25);
  }
  .dh1{ top:9%; left:7%; animation-delay:0s; font-size:1rem; }
  .dh2{ top:14%; right:9%; animation-delay:1.4s; font-size:.85rem; }
  .dh3{ bottom:11%; left:11%; animation-delay:2.7s; font-size:1.15rem; }
  @keyframes heartFloat{
    0%,100%{ transform:translateY(0) scale(1); opacity:.3; }
    50%{ transform:translateY(-12px) scale(1.08); opacity:.55; }
  }

  /* ============================================================
     CARD
     ============================================================ */
  .card-parallax{ position:relative; z-index:10; width:100%; display:flex; justify-content:center; pointer-events:none; }
  .card-float{ position:relative; animation:cardFloat 7s ease-in-out infinite; width:100%; display:flex; justify-content:center; pointer-events:none; }
  @keyframes cardFloat{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-7px); } }
  .card-float::before{
    content:"";
    position:absolute;
    left:12%; right:12%; bottom:-6px;
    height:26px;
    background:radial-gradient(ellipse, rgba(54,40,24,.28), rgba(54,40,24,0) 72%);
    filter:blur(7px);
    z-index:-1;
    animation:shadowPulse 7s ease-in-out infinite;
  }
  @keyframes shadowPulse{ 0%,100%{ opacity:.55; transform:scale(1); } 50%{ opacity:.32; transform:scale(.9); } }

  .card{
    position:relative;
    pointer-events:auto;
    width:min(90vw, 428px);
    border-radius:26px;
    background:linear-gradient(155deg, rgba(251,246,239,0.84), rgba(240,227,211,0.77));
    border:1px solid rgba(255,255,255,0.55);
    box-shadow:var(--shadow-1), var(--shadow-2), inset 0 1px 0 rgba(255,255,255,.4);
    backdrop-filter:blur(22px) saturate(1.05);
    -webkit-backdrop-filter:blur(22px) saturate(1.05);
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
    .card{ background:linear-gradient(155deg, rgba(251,246,239,0.97), rgba(240,227,211,0.96)); }
  }
  .card-texture{
    position:absolute; inset:0; border-radius:inherit;
    background-image:var(--texture-image);
    background-size:140px 140px;
    opacity:.05;
    mix-blend-mode:multiply;
    pointer-events:none;
  }
  .card-inner{
    position:relative;
    border-radius:inherit;
    overflow-y:auto;
    overflow-x:hidden;
    min-height:480px;
    max-height:min(74dvh, 640px);
    transition:height .7s var(--ease-soft);
    scrollbar-width:thin;
  }
  .face{
    position:absolute; top:0; left:0; right:0;
    padding:clamp(2.1rem, 1.6rem + 2.2vw, 3.1rem) clamp(1.6rem, 1.2rem + 1.8vw, 2.5rem);
    display:flex; flex-direction:column; align-items:center;
    text-align:center;
    opacity:0;
    transform:translateY(10px);
    transition:opacity .5s var(--ease-soft), transform .5s var(--ease-soft);
    pointer-events:none;
  }
  .face.is-active{
    opacity:1; transform:translateY(0);
    pointer-events:auto;
    transition-delay:.16s;
  }

  .eyebrow{
    font-family:var(--font-sans);
    font-size:.72rem;
    font-weight:600;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--terracotta-700);
  }
  .divider{ display:flex; align-items:center; gap:10px; width:100%; max-width:220px; margin:16px 0 6px; }
  .divider-line{ flex:1; height:1px; background:linear-gradient(90deg, transparent, rgba(74,55,40,.35), transparent); }
  .divider .divider-line:first-child{ background:linear-gradient(90deg, transparent, rgba(74,55,40,.35)); }
  .divider .divider-line:last-child{ background:linear-gradient(90deg, rgba(74,55,40,.35), transparent); }
  .divider-heart{ font-size:.7rem; color:var(--terracotta-500); }

  .heading{ display:flex; flex-direction:column; align-items:center; gap:.1em; margin-top:10px; }
  .heading-lead{
    font-family:var(--font-serif);
    font-weight:600;
    font-size:clamp(1.05rem, .9rem + .6vw, 1.4rem);
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-700);
  }
  .heading-script{
    font-family:var(--font-script);
    font-weight:400;
    font-size:clamp(2.7rem, 2.1rem + 3.2vw, 4rem);
    line-height:1.05;
    color:var(--terracotta-600);
    padding-bottom:.05em;
  }

  .quote{
    font-family:var(--font-serif);
    font-style:italic;
    font-weight:500;
    font-size:clamp(.95rem, .87rem + .3vw, 1.1rem);
    line-height:1.65;
    color:var(--ink-500);
    max-width:34ch;
    margin-top:18px;
  }

  .btn{
    margin-top:26px;
    cursor:pointer;
    transition:transform .35s var(--ease-out-back), box-shadow .35s ease, filter .35s ease;
  }
  .btn:focus-visible{ outline:2px solid var(--maroon-700); outline-offset:4px; border-radius:999px; }
  .btn-primary{
    display:inline-flex; align-items:center; justify-content:center;
    padding:1em 2.1em;
    border-radius:999px;
    background:linear-gradient(155deg, var(--terracotta-600), var(--terracotta-700));
    color:var(--white-glow);
    font-family:var(--font-sans);
    font-weight:600;
    font-size:.92rem;
    letter-spacing:.03em;
    box-shadow:0 12px 26px -10px rgba(124,63,38,.5), inset 0 1px 0 rgba(255,255,255,.28);
    min-height:44px;
  }
  .btn-primary:hover{
    transform:translateY(-3px) scale(1.02);
    box-shadow:0 18px 34px -12px rgba(124,63,38,.6), 0 0 0 6px rgba(196,120,74,.14), inset 0 1px 0 rgba(255,255,255,.3);
  }
  .btn-primary:active{ transform:translateY(-1px) scale(.97); }

  .letter-salutation{
    font-family:var(--font-serif);
    font-style:italic;
    font-weight:600;
    font-size:clamp(1.25rem, 1.1rem + .6vw, 1.55rem);
    color:var(--ink-700);
    align-self:flex-start;
    margin-bottom:14px;
  }
  .letter-body{ display:flex; flex-direction:column; gap:10px; }
  .letter-body p{
    font-family:var(--font-hand);
    font-weight:600;
    font-size:clamp(1.2rem, 1.05rem + .5vw, 1.42rem);
    line-height:1.55;
    color:var(--ink-700);
  }
  .letter-closing{
    font-family:var(--font-script);
    font-size:clamp(1.9rem, 1.6rem + 1.4vw, 2.5rem);
    color:var(--terracotta-600);
    margin-top:8px;
    line-height:1.1;
  }
  .letter-signoff{
    font-family:var(--font-script);
    font-size:clamp(1.5rem, 1.3rem + 1vw, 1.9rem);
    color:var(--ink-500);
    align-self:flex-end;
    margin-top:14px;
  }
  .btn-secondary{
    margin-top:22px;
    align-self:center;
    padding:.6em 1.3em;
    font-family:var(--font-sans);
    font-size:.78rem;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-500);
    border-bottom:1px solid transparent;
  }
  .btn-secondary:hover{ color:var(--terracotta-600); border-color:currentColor; }
  .btn-secondary:focus-visible{ outline:2px solid var(--maroon-700); outline-offset:3px; border-radius:6px; }

  /* ============================================================
     LOADER
     ============================================================ */
  .loader{
    position:fixed; inset:0; z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px;
    background:var(--cream-100);
    transition:opacity .6s ease, visibility .6s ease;
  }
  .loader.is-hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  .loader-heart{
    font-size:2.4rem;
    color:var(--terracotta-600);
    animation:heartbeat 1.15s ease-in-out infinite;
  }
  @keyframes heartbeat{
    0%,100%{ transform:scale(1); }
    25%{ transform:scale(1.18); }
    42%{ transform:scale(.94); }
    60%{ transform:scale(1.08); }
  }
  .loader-text{
    font-family:var(--font-serif);
    font-style:italic;
    font-weight:500;
    font-size:.95rem;
    letter-spacing:.05em;
    color:var(--ink-500);
    opacity:0;
    animation:loaderFadeIn .7s ease .3s forwards;
  }
  @keyframes loaderFadeIn{ to{ opacity:1; } }

  /* ============================================================
     PORTRAIT (phones / tablets in portrait) — full artwork, no crop
     ============================================================ */
  @media (max-aspect-ratio: 1/1){
    .stage{
      display:flex;
      flex-direction:column;
      align-items:center;
      height:auto;
      min-height:100vh;
      min-height:100dvh;
      overflow:visible;
      padding:0 0 6vh;
    }
    .bg-parallax{ position:relative; inset:auto; width:100%; }
    .bg-layer--cover{ display:none; }
    .bg-layer--frame{
      display:flex;
      justify-content:center;
      width:100%;
      padding-top:max(5vh, 22px);
      background:linear-gradient(180deg, var(--cream-50) 0%, var(--cream-200) 62%, var(--cream-300) 100%);
    }
    .bg-frame-image{
      width:100%;
      max-width:900px;
      aspect-ratio:735 / 490;
      background-image:var(--bg-image);
      background-size:cover;
      background-position:center;
      box-shadow:0 26px 46px -28px rgba(54,40,24,.4);
    }
    .glow-diya, .rakhi-hotspot{ display:none; }
    .card-parallax{ margin-top:-34px; padding:0 20px; }
    .card{ width:min(92vw, 410px); }
  }

  /* ============================================================
     SMALL SCREENS — trim type & spacing further
     ============================================================ */
  @media (max-width:420px){
    .heading-script{ font-size:clamp(2.3rem, 2rem + 4vw, 3rem); }
    .card{ border-radius:22px; }
    .quote{ max-width:30ch; }
  }

  /* ============================================================
     MOTION & INPUT PREFERENCES
     ============================================================ */
  @media (prefers-reduced-motion: reduce){
    .card-float, .card-float::before,
    .glow-ambient, .glow-diya,
    .loader-heart, .deco-heart,
    .rakhi-spark{ animation:none !important; }
    .face, .btn, .loader{ transition-duration:.15s !important; }
  }

  @media (hover:none){
    .rakhi-hotspot{ display:none; }
  }
</style>
</head>
<body>

  <div class="loader" id="loader" aria-hidden="true">
    <span class="loader-heart">♡</span>
    <p class="loader-text">Made with love</p>
  </div>

  <div class="stage" id="stage">

    <div class="bg-parallax" id="bgParallax" aria-hidden="true">
      <div class="bg-layer--cover"></div>
      <div class="bg-layer--frame">
        <div class="bg-frame-image"></div>
      </div>
      <div class="glow glow-ambient"></div>
      <div class="glow glow-diya"></div>
      <div class="rakhi-hotspot" id="rakhiHotspot">
        <span class="rakhi-spark s1"></span>
        <span class="rakhi-spark s2"></span>
        <span class="rakhi-spark s3"></span>
      </div>
    </div>

    <div class="bg-tint" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <div class="particles" id="particles" aria-hidden="true"></div>
    <div class="deco-hearts" aria-hidden="true">
      <span class="deco-heart dh1">♡</span>
      <span class="deco-heart dh2">♡</span>
      <span class="deco-heart dh3">♡</span>
    </div>

    <div class="card-parallax" id="cardParallax">
      <div class="card-float">
        <main class="card" id="card" aria-label="Raksha Bandhan greeting card">
          <div class="card-texture"></div>
          <div class="card-inner" id="cardInner">

            <section class="face face-front is-active" id="faceFront">
              <p class="eyebrow" id="eyebrowText">For online pokemon ♡</p>
              <div class="divider"><span class="divider-line"></span><span class="divider-heart">♡</span><span class="divider-line"></span></div>
              <h1 class="heading">
                <span class="heading-lead" id="headingLeadText">Happy</span>
                <span class="heading-script" id="headingScriptText">Raksha Bandhan</span>
              </h1>
              <p class="quote" id="quoteText"></p>
              <button type="button" class="btn btn-primary" id="openBtn">Button tod ye wala ♡</button>
            </section>

            <section class="face face-letter" id="faceLetter" inert aria-hidden="true">
              <p class="letter-salutation" id="letterSalutation">Skiii ji,</p>
              <div class="letter-body" id="letterBody">
                <p>No matter how much we annoy each other, argue over the dumbest things, or pretend we don't care&hellip;</p>
                <p>you remain a nice safe spot</p>
              </div>
              <p class="letter-closing" id="letterClosing">Happy Raksha Bandhan ♡</p>
              <p class="letter-signoff" id="letterSignoff">With love, BY TUFF JB ♡</p>
              <button type="button" class="btn btn-secondary" id="closeBtn">piche to dekho ♡</button>
            </section>

          </div>
        </main>
      </div>
    </div>

  </div>

  <noscript>
    <style>#loader{ display:none !important; }</style>
  </noscript>

<script>
(function(){
  "use strict";

  /* ============================================================
     ✏️  EDIT YOUR MESSAGE HERE — the one obvious place
     Change any of the strings below and reload the page.
     ============================================================ */
  var CONTENT = {
    eyebrow: "For online pokemon ♡",
    headingLead: "Happy",
    headingScript: "Raksha Bandhan",
    quote: "Proof that the internet occasionally does something good.",
    openButtonLabel: "Button tod ye wala ♡",
    letter: {
      salutation: "Skiii ji,",
      paragraphs: [
        "No matter how much we annoy each other, argue over the dumbest things, or pretend we don't care\u2026",
        "you remain a nice safe spot"
      ],
      closingLine: "Happy Raksha Bandhan ♡",
      signoff: "With love, wishing you all the best for the exams, by tuff jb ♡"
    },
    closeButtonLabel: "piche to dekho ♡"
  };

  function byId(id){ return document.getElementById(id); }

  function renderContent(){
    byId('eyebrowText').textContent = CONTENT.eyebrow;
    byId('headingLeadText').textContent = CONTENT.headingLead;
    byId('headingScriptText').textContent = CONTENT.headingScript;
    byId('quoteText').textContent = CONTENT.quote;
    byId('openBtn').textContent = CONTENT.openButtonLabel;
    byId('letterSalutation').textContent = CONTENT.letter.salutation;

    var body = byId('letterBody');
    body.innerHTML = '';
    CONTENT.letter.paragraphs.forEach(function(text){
      var p = document.createElement('p');
      p.textContent = text;
      body.appendChild(p);
    });

    byId('letterClosing').textContent = CONTENT.letter.closingLine;
    byId('letterSignoff').textContent = CONTENT.letter.signoff;
    byId('closeBtn').textContent = CONTENT.closeButtonLabel;
  }

  /* ============================================================
     Card open / close
     ============================================================ */
  var card = byId('card');
  var cardInner = byId('cardInner');
  var faceFront = byId('faceFront');
  var faceLetter = byId('faceLetter');
  var openBtn = byId('openBtn');
  var closeBtn = byId('closeBtn');
  var stage = byId('stage');

  function setCardHeight(px){ cardInner.style.height = px + 'px'; }
  function initCardHeight(){ setCardHeight(faceFront.scrollHeight); }

  function openLetter(){
    if (card.classList.contains('is-open')) return;
    faceLetter.removeAttribute('inert');
    faceLetter.removeAttribute('aria-hidden');
    faceFront.setAttribute('inert','');
    faceFront.setAttribute('aria-hidden','true');
    faceFront.classList.remove('is-active');
    faceLetter.classList.add('is-active');
    card.classList.add('is-open');
    stage.classList.add('is-open');
    setCardHeight(faceLetter.scrollHeight);
    window.setTimeout(function(){ closeBtn.focus(); }, 350);
  }

  function closeLetter(){
    if (!card.classList.contains('is-open')) return;
    faceFront.removeAttribute('inert');
    faceFront.removeAttribute('aria-hidden');
    faceLetter.setAttribute('inert','');
    faceLetter.setAttribute('aria-hidden','true');
    faceLetter.classList.remove('is-active');
    faceFront.classList.add('is-active');
    card.classList.remove('is-open');
    stage.classList.remove('is-open');
    setCardHeight(faceFront.scrollHeight);
    window.setTimeout(function(){ openBtn.focus(); }, 350);
  }

  openBtn.addEventListener('click', openLetter);
  closeBtn.addEventListener('click', closeLetter);
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && card.classList.contains('is-open')) closeLetter();
  });

  var resizeRAF;
  window.addEventListener('resize', function(){
    window.cancelAnimationFrame(resizeRAF);
    resizeRAF = window.requestAnimationFrame(function(){
      var active = card.classList.contains('is-open') ? faceLetter : faceFront;
      var prevTransition = cardInner.style.transition;
      cardInner.style.transition = 'none';
      setCardHeight(active.scrollHeight);
      void cardInner.offsetHeight;
      cardInner.style.transition = prevTransition;
    });
  });

  /* ============================================================
     Motion / input preferences
     ============================================================ */
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var finePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  /* ============================================================
     Floating particles
     ============================================================ */
  function generateParticles(){
    if (reduceMotion) return;
    var container = byId('particles');
    var narrow = window.matchMedia('(max-width: 640px)').matches;
    var count = narrow ? 14 : 26;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < count; i++){
      var p = document.createElement('span');
      p.className = 'particle';
      var size = (3 + Math.random() * 4).toFixed(1);
      var left = (Math.random() * 100).toFixed(1);
      var duration = (16 + Math.random() * 16).toFixed(1);
      var delay = (-(Math.random() * duration)).toFixed(1);
      var drift = ((Math.random() * 2 - 1) * 50).toFixed(0);
      var peak = (0.15 + Math.random() * 0.25).toFixed(2);
      p.style.setProperty('--size', size + 'px');
      p.style.setProperty('--left', left + '%');
      p.style.setProperty('--duration', duration + 's');
      p.style.setProperty('--delay', delay + 's');
      p.style.setProperty('--drift', drift + 'px');
      p.style.setProperty('--peak', peak);
      frag.appendChild(p);
    }
    container.appendChild(frag);
  }

  /* ============================================================
     Mouse parallax (fine pointers only, disabled on touch / reduced motion)
     ============================================================ */
  function setupParallax(){
    if (reduceMotion || !finePointer) return;
    var bgParallax = byId('bgParallax');
    var cardParallax = byId('cardParallax');
    var tx = 0, ty = 0, cx = 0, cy = 0;

    function onMove(e){
      tx = (e.clientX / window.innerWidth) - 0.5;
      ty = (e.clientY / window.innerHeight) - 0.5;
    }
    function tick(){
      cx += (tx - cx) * 0.07;
      cy += (ty - cy) * 0.07;
      bgParallax.style.transform = 'translate3d(' + (cx * -16).toFixed(2) + 'px,' + (cy * -16).toFixed(2) + 'px,0)';
      cardParallax.style.transform = 'translate3d(' + (cx * 10).toFixed(2) + 'px,' + (cy * 10).toFixed(2) + 'px,0)';
      window.requestAnimationFrame(tick);
    }
    window.addEventListener('pointermove', onMove, { passive:true });
    window.requestAnimationFrame(tick);
  }

  /* ============================================================
     Rakhi hotspot (tap fallback for touch-with-hover-unsupported cases)
     ============================================================ */
  function setupRakhiHotspot(){
    var hotspot = byId('rakhiHotspot');
    if (!hotspot) return;
    hotspot.addEventListener('click', function(){
      hotspot.classList.add('is-active');
      window.setTimeout(function(){ hotspot.classList.remove('is-active'); }, 1100);
    });
  }

  /* ============================================================
     Loader
     ============================================================ */
  function wait(ms){ return new Promise(function(resolve){ window.setTimeout(resolve, ms); }); }

  function revealPage(){
    var loader = byId('loader');
    // Measure now that the real fonts have (most likely) finished swapping in,
    // so the card isn't sized against fallback-font metrics.
    initCardHeight();
    loader.classList.add('is-hidden');
    stage.removeAttribute('inert');
    loader.addEventListener('transitionend', function handler(){
      loader.style.display = 'none';
      loader.removeEventListener('transitionend', handler);
    });
  }

  /* ============================================================
     Init
     ============================================================ */
  stage.setAttribute('inert','');
  renderContent();
  initCardHeight(); // rough initial size; refined in revealPage() once fonts are ready
  generateParticles();
  setupParallax();
  setupRakhiHotspot();

  var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  Promise.race([
    Promise.all([fontsReady, wait(650)]),
    wait(2200)
  ]).then(revealPage);

})();
</script>
</body>
